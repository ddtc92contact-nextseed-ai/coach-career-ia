# Déploiement production derrière le Traefik existant du VPS.
# Aucun port publié : Traefik joint l'app via le réseau externe TRAEFIK_NETWORK.
# Toutes les valeurs viennent de .env (voir .env.example).
name: coach-career-ia

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/${POSTGRES_DB:-coach_career}
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis}
  AUTH_URL: https://${SITE_DOMAIN:?SITE_DOMAIN requis}
  AUTH_TRUST_HOST: "true"
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY requis}
  DATA_ENCRYPTION_KEY_VERSION: ${DATA_ENCRYPTION_KEY_VERSION:-1}
  DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM requis}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST requis en production}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Pièces justificatives chiffrées (volume `uploads`).
  UPLOAD_DIR: /app/storage/uploads
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  # Géocodage des lieux des garde-fous (User-Agent : RADAR_CONTACT, sinon AUTH_URL).
  RADAR_CONTACT: ${RADAR_CONTACT:-}
  GEO_ENABLED: ${GEO_ENABLED:-true}
  GEO_NOMINATIM_ENABLED: ${GEO_NOMINATIM_ENABLED:-true}
  # IA (import du parcours) : sans clé, l'import est simplement désactivé.
  AI_PROVIDER: ${AI_PROVIDER:-mistral}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-}
  MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  OPENAI_COMPAT_CHAT_MODEL: ${OPENAI_COMPAT_CHAT_MODEL:-}
  OPENAI_COMPAT_EMBED_MODEL: ${OPENAI_COMPAT_EMBED_MODEL:-}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-45000}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

services:
  app:
    build:
      context: .
      target: runner
    image: coach-career-ia:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/storage/uploads
    networks:
      - internal
      - traefik
    mem_limit: ${APP_MEM_LIMIT:-768m}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK requis}
      - traefik.http.routers.coach-career-ia.rule=Host(`${SITE_DOMAIN}`)
      - traefik.http.routers.coach-career-ia.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.coach-career-ia.tls=true
      - traefik.http.routers.coach-career-ia.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.coach-career-ia.loadbalancer.server.port=3000

  # Applique les migrations Prisma puis s'arrête (l'app attend sa réussite).
  migrate:
    build:
      context: .
      target: migrate
    image: coach-career-ia-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coach_career}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 512m

  # Tâches de fond : Market Radar (collecte d'offres) toutes les RADAR_INTERVAL_HOURS,
  # matching (recalcul des opportunités) et alertes e-mail.
  worker:
    build:
      context: .
      target: worker
    image: coach-career-ia-worker:latest
    restart: unless-stopped
    environment:
      # Mêmes réglages que l'app : base, clé de chiffrement (entreprises exclues),
      # SMTP (alertes), IA (embeddings, explications), AUTH_URL (liens des e-mails).
      <<: *app-env
      # Matching : voir .env.example (valeurs par défaut raisonnables).
      MATCHING_ENABLED: ${MATCHING_ENABLED:-true}
      MATCHING_POLL_SECONDS: ${MATCHING_POLL_SECONDS:-60}
      MATCHING_DEBOUNCE_SECONDS: ${MATCHING_DEBOUNCE_SECONDS:-30}
      MATCHING_MIN_SCORE: ${MATCHING_MIN_SCORE:-40}
      MATCHING_LLM_EXPLANATIONS: ${MATCHING_LLM_EXPLANATIONS:-true}
      MATCHING_LLM_MAX_PER_RUN: ${MATCHING_LLM_MAX_PER_RUN:-30}
      MATCHING_SIM_FLOOR: ${MATCHING_SIM_FLOOR:-0.55}
      MATCHING_SIM_CEIL: ${MATCHING_SIM_CEIL:-0.85}
      RADAR_CONTACT: ${RADAR_CONTACT:?RADAR_CONTACT requis (contact du User-Agent du radar)}
      RADAR_INTERVAL_HOURS: ${RADAR_INTERVAL_HOURS:-6}
      RADAR_RUN_ON_START: ${RADAR_RUN_ON_START:-true}
      RADAR_COUNTRIES: ${RADAR_COUNTRIES:-FR}
      RADAR_COMPANIES_FILE: ${RADAR_COMPANIES_FILE:-config/radar-companies.json}
      RADAR_MIN_INTERVAL_MS: ${RADAR_MIN_INTERVAL_MS:-1000}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      RADAR_FT_ROME_CODES: ${RADAR_FT_ROME_CODES:-}
      RADAR_FT_KEYWORDS: ${RADAR_FT_KEYWORDS:-}
      RADAR_FT_DEPARTMENTS: ${RADAR_FT_DEPARTMENTS:-}
      RADAR_FT_MAX_RESULTS: ${RADAR_FT_MAX_RESULTS:-1050}
      GEO_ENABLED: ${GEO_ENABLED:-true}
      GEO_NOMINATIM_ENABLED: ${GEO_NOMINATIM_ENABLED:-true}
      GEO_NOMINATIM_MAX_PER_RUN: ${GEO_NOMINATIM_MAX_PER_RUN:-200}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    mem_limit: ${WORKER_MEM_LIMIT:-384m}

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coach_career}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true

volumes:
  pgdata:
  uploads:
