name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach_career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach_career_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://coach:coach@localhost:5432/coach_career_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migration + seed sur base vierge
        env:
          PGPASSWORD: coach
          DATABASE_URL: postgresql://coach:coach@localhost:5432/coach_career_fresh
        run: |
          psql -h localhost -U coach -d coach_career_test -c "CREATE DATABASE coach_career_fresh"
          npm run db:migrate && npm run db:seed
          # Relancé : le seed doit rester idempotent.
          npm run db:seed
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image applicative
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: coach-career-ia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image de migration
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: coach-career-ia-migrate:ci
          cache-from: type=gha
      - name: Image du worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: coach-career-ia-worker:ci
          cache-from: type=gha
