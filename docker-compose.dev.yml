# PostgreSQL + pgvector pour le développement local et les tests.
#   npm run db:up    # démarre la base (port hôte : POSTGRES_PORT, 5433 par défaut)
#   npm run db:down
# Le port n'est publié que sur 127.0.0.1. Deux bases sont créées :
# `coach_career` (dev) et `coach_career_test` (tests Vitest).
name: coach-career-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach_career
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_career"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata-dev:
